name: Produktionsdatenbank Baseline-Diagnose

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Zur einmaligen READ-ONLY-Diagnose exakt BASELINE-DIAGNOSE eingeben"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  diagnose:
    name: Produktionsstand gegen Migrationen 001-039 analysieren
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Diagnose-Kontext strikt pruefen
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "BASELINE-DIAGNOSE" ]; then
            echo "FEHLER: Bestaetigung stimmt nicht exakt." >&2
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/feature/db-diagnose-*)
              ;;
            *)
              echo "FEHLER: Baseline-Diagnose ist nur auf main oder feature/db-diagnose-* erlaubt." >&2
              exit 1
              ;;
          esac
          branch="${GITHUB_REF#refs/heads/}"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" --prune
          remote_head="$(git rev-parse "origin/$branch")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "FEHLER: Workflow-Commit ist nicht der aktuelle Remote-Branch-Stand." >&2
            echo "Workflow: $GITHUB_SHA" >&2
            echo "origin/$branch: $remote_head" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "FEHLER: Repository-Secret SUPABASE_DB_URL fehlt." >&2
            exit 1
          fi

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Docker-Umgebung pruefen
        run: docker info

      - name: Read-only Baseline-Diagnose ausfuehren
        shell: bash
        run: bash scripts/ci/recover-production-migration-baseline.sh

      - name: Diagnose-Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: produktionsdatenbank-baseline-diagnose-${{ github.sha }}
          path: ulc-db-baseline-diagnostic/
          if-no-files-found: error
          retention-days: 7
