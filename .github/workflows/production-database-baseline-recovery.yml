name: Produktionsdatenbank Baseline-Recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Zur einmaligen Ausfuehrung exakt BASELINE-REPARIEREN eingeben"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  recover:
    name: Historie 001-039 verifizieren und Migration 040 anwenden
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recovery-Kontext strikt pruefen
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirmation }}" != "BASELINE-REPARIEREN" ]; then
            echo "FEHLER: Bestaetigung stimmt nicht exakt." >&2
            exit 1
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "FEHLER: Baseline-Recovery darf ausschliesslich auf main ausgefuehrt werden." >&2
            exit 1
          fi
          git fetch origin main --prune
          remote_main="$(git rev-parse origin/main)"
          if [ "$remote_main" != "$GITHUB_SHA" ]; then
            echo "FEHLER: Workflow-Commit ist nicht der aktuelle origin/main." >&2
            echo "Workflow: $GITHUB_SHA" >&2
            echo "origin/main: $remote_main" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "FEHLER: Repository-Secret SUPABASE_DB_URL fehlt." >&2
            exit 1
          fi

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Docker-Umgebung pruefen
        run: docker info

      - name: Verifizieren, baselinen und offene Migration anwenden
        shell: bash
        run: bash scripts/ci/recover-production-migration-baseline.sh
