name: Qualitätsprüfung

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Tests, Build und Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://e2e.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_runtime_tests
      VITE_ALLOW_SELF_SIGNUP: "false"
      E2E_RUNTIME_BASE_URL: http://127.0.0.1:4175

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Laufzeitversionen anzeigen
        run: |
          node --version
          npm --version

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Playwright Test isoliert installieren
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Chromium für echten Runtime-Test installieren
        run: npx playwright install --with-deps chromium

      - name: Vollständiges Release-Gate ausführen
        run: npm run release:check:ci

      - name: Runtime-Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-report-${{ github.run_id }}
          path: |
            test-results/runtime
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
