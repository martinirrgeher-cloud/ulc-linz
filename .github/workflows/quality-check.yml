name: Qualitätsprüfung

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, Tests und Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Laufzeitversionen anzeigen
        run: |
          node --version
          npm --version

      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci

      - name: Qualitätsprüfung ausführen
        run: npm run ci:quality
