name: Wöchentliches verschlüsseltes Supabase-Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: read

concurrency:
  group: weekly-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      DRIVE_TARGET: gdrive:ULC-Linz-App-Backups

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Voraussetzungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for variable in SUPABASE_DB_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY BACKUP_ENCRYPTION_PASSWORD RCLONE_CONFIG_B64; do
            if [ -z "${!variable:-}" ]; then
              echo "Fehlendes GitHub Secret: $variable" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#BACKUP_ENCRYPTION_PASSWORD}" -lt 20 ]; then
            echo "BACKUP_ENCRYPTION_PASSWORD muss mindestens 20 Zeichen lang sein." >&2
            exit 1
          fi

      - name: Backup-Verzeichnis vorbereiten
        id: names
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y-%m-%d_%H-%M-%S_UTC')"
          archive="ULC-Linz-App-Backup_${stamp}.tar.gz"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          mkdir -p backup/database backup/storage backup/project
          cp -R supabase/migrations backup/project/migrations
          cp supabase/config.toml backup/project/config.toml
          cp scripts/restore-supabase-storage.mjs backup/project/restore-supabase-storage.mjs
          cp BACKUP-GOOGLE-DRIVE-EINRICHTUNG.md backup/project/README-BACKUP.md

      - name: Datenbankrollen sichern
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/roles.sql --role-only

      - name: Datenbankschema sichern
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/schema.sql

      - name: Datenbankinhalt sichern
        run: supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/database/data.sql --data-only --use-copy

      - name: Vollständigen PostgreSQL-Notfallauszug erstellen
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm postgres:17-alpine \
            pg_dump "$SUPABASE_DB_URL" \
              --format=custom \
              --no-owner \
              --no-privileges \
            > backup/database/full-database.dump
          test -s backup/database/full-database.dump

      - name: Storage-Dateien sichern
        run: node scripts/backup-supabase-storage.mjs backup/storage

      - name: Manifest und Prüfsummen erstellen
        shell: bash
        run: |
          set -euo pipefail
          cat > backup/RESTORE-HINWEIS.txt <<'EOF'
          Dieses Archiv enthält portable SQL-Exporte, einen zusätzlichen PostgreSQL-
          Vollauszug inklusive Auth- und Storage-Metadaten sowie sämtliche tatsächlichen
          Supabase-Storage-Dateien. Vor einer Wiederherstellung zuerst die zum Archiv
          gehörenden Migrationen und die Supabase-Dokumentation prüfen. Niemals ungeprüft
          in die produktive Datenbank einspielen.
          EOF
          (
            cd backup
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          du -sh backup

      - name: Backup verschlüsseln
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ steps.names.outputs.archive }}" backup
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --symmetric \
            --cipher-algo AES256 \
            --compress-algo none \
            --output "${{ steps.names.outputs.archive }}.gpg" \
            "${{ steps.names.outputs.archive }}"
          rm -rf backup "${{ steps.names.outputs.archive }}"

      - name: rclone installieren und Google Drive konfigurieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd gdrive: >/dev/null

      - name: Verschlüsseltes Archiv nach Google Drive laden
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.names.outputs.archive }}.gpg"
          rclone mkdir "$DRIVE_TARGET"
          rclone copyto "$file" "$DRIVE_TARGET/$file" --transfers 1 --checkers 4 --retries 5
          rclone lsl "$DRIVE_TARGET/$file"
          rclone delete "$DRIVE_TARGET" \
            --min-age 84d \
            --include "ULC-Linz-App-Backup_*.tar.gz.gpg" \
            --exclude "*"
          rm -f "$file"

      - name: Ergebnis zusammenfassen
        if: always()
        shell: bash
        run: |
          {
            echo "## Wöchentliches Supabase-Backup"
            echo ""
            echo "- Zeitpunkt: ${{ steps.names.outputs.stamp || 'nicht erstellt' }}"
            echo "- Ziel: Google Drive / ULC-Linz-App-Backups"
            echo "- Aufbewahrung: 12 Wochen"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
