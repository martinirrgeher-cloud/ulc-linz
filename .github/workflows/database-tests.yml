name: Datenbank- und RLS-Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "scripts/run-database-tests.ps1"
      - ".github/workflows/database-tests.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/run-database-tests.ps1"
      - ".github/workflows/database-tests.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    name: Migrationen, RLS und Transaktionen
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Docker-Umgebung pruefen
        run: docker info

      - name: Isolierte lokale Supabase-Umgebung starten
        run: >
          supabase start
          -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime

      # A fresh GitHub runner is already built from all repository migrations by
      # supabase start. Avoiding a second reset saves time and avoids duplicate work.
      - name: Lokalen Migrationsstand anzeigen
        run: supabase migration list --local

      - name: pgTAP-Datenbanktests ausfuehren
        run: |
          supabase test db \
            supabase/tests/database/00_schema_and_security.test.sql \
            supabase/tests/database/10_role_matrix.test.sql \
            supabase/tests/database/20_collaboration.test.sql \
            supabase/tests/database/30_transactional_import.test.sql \
            supabase/tests/database/31_exercise_import_v2.test.sql \
            supabase/tests/database/40_realtime_collaboration.test.sql \
            supabase/tests/database/50_catalog_block_intelligence.test.sql \
            supabase/tests/database/60_user_management_e5c.test.sql \
            supabase/tests/database/61_parent_multi_athlete_links.test.sql \
            supabase/tests/database/70_catalog_block_read_models.test.sql \
            supabase/tests/database/71_statistics_permissions_training_modules.test.sql

      - name: Lokale Testumgebung entfernen
        if: always()
        run: supabase stop --no-backup || true
