name: Produktionsbackend verifizieren

on:
  push:
    branches:
      - main
permissions:
  contents: write

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  verify:
    name: Datenbank migrieren und Edge Function deployen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xddbuldehewyrezhrhej
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Produktionszugang pruefen
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo "FEHLER: Repository-Secret SUPABASE_DB_URL fehlt."; exit 1; }
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "FEHLER: Repository-Secret SUPABASE_ACCESS_TOKEN fehlt."; exit 1; }

      - name: Migrationen vorab pruefen
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Migrationen anwenden
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Produktionsdatenbank vollstaendig verifizieren
        shell: bash
        run: bash scripts/ci/verify-production-database.sh

      - name: invite-member fuer exakt diesen Commit deployen
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy invite-member --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | tee .ulc-production-backend/functions-list.txt
          grep -q 'invite-member' .ulc-production-backend/functions-list.txt || {
            echo "FEHLER: invite-member wurde nach dem Deployment nicht gefunden." >&2
            exit 1
          }

      - name: Diagnose bei Backend-Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: produktionsbackend-diagnose-${{ github.sha }}
          path: .ulc-production-backend/
          if-no-files-found: warn
          retention-days: 7

      - name: Produktionsbackend fuer Commit bestaetigen
        shell: bash
        run: |
          set -euo pipefail
          tag="backend-verified-${GITHUB_SHA}"
          existing="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "FEHLER: Verifikations-Tag ${tag} zeigt auf einen unerwarteten Commit: ${existing}"
              exit 1
            fi
            echo "Verifikations-Tag existiert bereits korrekt: ${tag}"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/${tag}"
          echo "Produktionsbackend verifiziert: ${tag}"
