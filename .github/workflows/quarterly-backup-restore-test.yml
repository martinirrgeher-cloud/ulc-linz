name: E3d Backup-Wiederherstellungsprobe

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: "Optionaler Dateiname aus Google Drive; leer = neuestes Backup"
        required: false
        type: string
  schedule:
    - cron: "45 3 1 1,4,7,10 *"

permissions:
  contents: read

concurrency:
  group: quarterly-backup-restore-test
  cancel-in-progress: false

jobs:
  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      DRIVE_TARGET: gdrive:ULC-Linz-App-Backups

    steps:
      - name: Projekt auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Supabase CLI einrichten
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Voraussetzungen prüfen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p restore/report
          if [ -z "${BACKUP_ENCRYPTION_PASSWORD:-}" ] || [ -z "${RCLONE_CONFIG_B64:-}" ]; then
            echo "BACKUP_ENCRYPTION_PASSWORD oder RCLONE_CONFIG_B64 fehlt." >&2
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSWORD}" -lt 20 ]; then
            echo "BACKUP_ENCRYPTION_PASSWORD muss mindestens 20 Zeichen lang sein." >&2
            exit 1
          fi
          docker info >/dev/null

      - name: rclone installieren und Google Drive konfigurieren
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsd gdrive: >/dev/null

      - name: Backup auswählen und herunterladen
        id: backup
        shell: bash
        env:
          REQUESTED_BACKUP: ${{ inputs.backup_file || '' }}
        run: |
          set -euo pipefail
          selected="$REQUESTED_BACKUP"
          if [ -z "$selected" ]; then
            selected="$(rclone lsf "$DRIVE_TARGET" \
              --files-only \
              --include "ULC-Linz-App-Backup_*.tar.gz.gpg" \
              | sort \
              | tail -n 1)"
          fi
          if [ -z "$selected" ]; then
            echo "Kein verschlüsseltes Backup in Google Drive gefunden." >&2
            exit 1
          fi
          case "$selected" in
            ULC-Linz-App-Backup_*.tar.gz.gpg) ;;
            *) echo "Ungültiger Backup-Dateiname: $selected" >&2; exit 1 ;;
          esac
          mkdir -p restore/download restore/extracted restore/report
          rclone copyto "$DRIVE_TARGET/$selected" "restore/download/$selected" --transfers 1 --checkers 4 --retries 5
          test -s "restore/download/$selected"
          sha256="$(sha256sum "restore/download/$selected" | cut -d' ' -f1)"
          bytes="$(stat -c '%s' "restore/download/$selected")"
          printf '%s\n' "$selected" > restore/report/selected-backup.txt
          printf '%s  %s\n' "$sha256" "$selected" > restore/report/encrypted-archive.sha256
          printf '%s\n' "$bytes" > restore/report/encrypted-archive.bytes
          echo "file=$selected" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Backup entschlüsseln und Archiv vollständig prüfen
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          file="${{ steps.backup.outputs.file }}"
          printf '%s' "$BACKUP_ENCRYPTION_PASSWORD" | gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase-fd 0 \
            --output restore/backup.tar.gz \
            --decrypt "restore/download/$file"
          tar -tzf restore/backup.tar.gz >/dev/null
          tar -xzf restore/backup.tar.gz -C restore/extracted
          node scripts/verify-backup-archive.mjs \
            restore/extracted/backup \
            --json=restore/report/archive-verification.json
          entries="$(docker run --rm \
            -v "$PWD/restore/extracted/backup/database:/backup:ro" \
            postgres:17-alpine \
            pg_restore --list /backup/full-database.dump \
            | grep -cve '^;' || true)"
          if [ "${entries:-0}" -le 0 ]; then
            echo "Der PostgreSQL-Dump-Katalog ist leer." >&2
            exit 1
          fi
          echo "$entries" > restore/report/pg-restore-entry-count.txt
          echo "catalog_entries=$entries" >> "$GITHUB_OUTPUT"

      - name: Isolierte lokale Supabase-Umgebung starten
        shell: bash
        env:
          OPENAI_API_KEY: not-used-in-restore-test
          SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN: not-used-in-restore-test
          SUPABASE_AUTH_EXTERNAL_APPLE_SECRET: not-used-in-restore-test
          S3_HOST: not-used-in-restore-test
          S3_REGION: local
          S3_ACCESS_KEY: not-used-in-restore-test
          S3_SECRET_KEY: not-used-in-restore-test
        run: |
          set -euo pipefail
          supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
          supabase status -o env > restore/local-supabase.env
          test -s restore/local-supabase.env

      - name: Vollauszug und portablen Export in getrennte Datenbanken einspielen
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source restore/local-supabase.env
          set +a
          : "${DB_URL:?DB_URL wurde von Supabase CLI nicht geliefert.}"
          base_db_url="${DB_URL%/*}"
          full_db_url="$base_db_url/ulc_restore_full"
          portable_db_url="$base_db_url/ulc_restore_portable"

          for database in ulc_restore_full ulc_restore_portable; do
            docker run --rm --network host postgres:17-alpine \
              psql -X -v ON_ERROR_STOP=1 "$DB_URL" \
              -c "drop database if exists $database with (force);"
            docker run --rm --network host postgres:17-alpine \
              psql -X -v ON_ERROR_STOP=1 "$DB_URL" \
              -c "create database $database;"
          done

          docker run --rm --network host \
            -v "$PWD/restore/extracted/backup/database:/backup:ro" \
            postgres:17-alpine \
            pg_restore \
              --dbname "$full_db_url" \
              --no-owner \
              --no-privileges \
              --exit-on-error \
              /backup/full-database.dump

          docker run --rm --network host \
            -v "$PWD/restore/extracted/backup/database:/backup:ro" \
            postgres:17-alpine \
            psql -X -v ON_ERROR_STOP=1 "$portable_db_url" -f /backup/schema.sql
          docker run --rm --network host \
            -v "$PWD/restore/extracted/backup/database:/backup:ro" \
            postgres:17-alpine \
            psql -X -v ON_ERROR_STOP=1 "$portable_db_url" -f /backup/data.sql

          cat > restore/database-urls.env <<EOF
          FULL_RESTORE_DB_URL=$full_db_url
          PORTABLE_RESTORE_DB_URL=$portable_db_url
          EOF
          chmod 600 restore/database-urls.env

      - name: Wiederhergestellte Datenbanken fachlich prüfen
        shell: bash
        env:
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          BACKUP_ENCRYPTED_SHA256: ${{ steps.backup.outputs.sha256 }}
          BACKUP_ENCRYPTED_BYTES: ${{ steps.backup.outputs.bytes }}
          DUMP_CATALOG_ENTRIES: ${{ steps.archive.outputs.catalog_entries }}
          BACKUP_ROOT: restore/extracted/backup
          RESTORE_REPORT_JSON: restore/report/database-restore-report.json
          RESTORE_REPORT_MARKDOWN: restore/report/database-restore-report.md
        run: |
          set -euo pipefail
          set -a
          source restore/database-urls.env
          set +a
          node scripts/verify-restored-database.mjs
          cat restore/report/database-restore-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Storage in lokale Testumgebung einspielen und vollständig prüfen
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source restore/local-supabase.env
          set +a
          : "${API_URL:?API_URL wurde von Supabase CLI nicht geliefert.}"
          : "${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY wurde von Supabase CLI nicht geliefert.}"
          SUPABASE_URL="$API_URL" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            node scripts/restore-supabase-storage.mjs \
              restore/extracted/backup/storage \
              --apply \
              --overwrite \
              --verify \
              --sync-buckets \
              --report-json=restore/report/storage-restore.json

      - name: Wiederherstellungsbericht als Artefakt speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e3d-backup-restore-report-${{ github.run_id }}
          path: restore/report
          if-no-files-found: warn
          retention-days: 30

      - name: Lokale Testumgebung und entschlüsselte Daten entfernen
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup || true
          rm -rf restore

      - name: Ergebnis zusammenfassen
        if: always()
        shell: bash
        run: |
          {
            echo "## E3d Backup-Wiederherstellungsprobe"
            echo ""
            echo "- Backup: ${{ steps.backup.outputs.file || 'nicht ausgewählt' }}"
            echo "- Vollauszug: isolierte Datenbank ulc_restore_full"
            echo "- Portabler Export: isolierte Datenbank ulc_restore_portable"
            echo "- Storage: lokale Supabase-Storage-Instanz mit SHA-256-Rückprüfung"
            echo "- Produktivsystem verändert: nein"
            echo "- Bericht: GitHub-Artefakt e3d-backup-restore-report-${{ github.run_id }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
